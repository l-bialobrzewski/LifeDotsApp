name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Wartosci ponizej to nieszkodliwe placeholdery wylacznie do prerenderu
        # stron statycznych w CI (np. /login tworzy klienta Supabase w czasie
        # builda). To NIE sa sekrety - realne wartosci ustawia Vercel per srodowisko.
        # Mozna nadpisac je sekretami repo, jesli build ma uzywac konkretnego projektu.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_CI_PLACEHOLDER || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_CI_PLACEHOLDER || 'placeholder-anon-key' }}
          NOTE_ENCRYPTION_KEY: ${{ secrets.NOTE_ENCRYPTION_KEY_CI_PLACEHOLDER || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=high || true

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
